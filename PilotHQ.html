<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PilotHQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --soft:#F0EEE8; --sunk:#FAF9F6; --ink:#151513; --ink2:#3A3935; --muted:#6E6C66; --line:#E6E3DC; --line2:#D6D2C8;
  --accent:#1D5C3F; --accent-h:#164A32; --accent-soft:#E4EFE8; --on-accent:#FFFFFF;
  --pia:#5B45C9; --pia-soft:#EFECFB; --pia-line:#C9C0F2;
  --amber:#8A5300; --amber-soft:#FBF1DD; --red:#A12A1F; --red-soft:#F9E5E2; --blue:#2A5585; --blue-soft:#E5EDF6;
  --r:6px; --r2:10px; --gap:16px;
  --serif:"Newsreader",Georgia,serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --surface:#1C1C1A; --soft:#262522; --sunk:#181816; --ink:#EDEBE6; --ink2:#CFCCC4; --muted:#9C998F; --line:#2E2D29; --line2:#3D3B36;
  --accent:#4FA57A; --accent-h:#5DB487; --accent-soft:#1F3328; --on-accent:#0E1A13;
  --pia:#A595F2; --pia-soft:#27223F; --pia-line:#4A3F86;
  --amber:#E2A84B; --amber-soft:#3A2E17; --red:#EE8A7E; --red-soft:#3D201C; --blue:#8DB4E4; --blue-soft:#1C2A3B; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#141412;--surface:#1C1C1A;--soft:#262522;--sunk:#181816;--ink:#EDEBE6;--ink2:#CFCCC4;--muted:#9C998F;--line:#2E2D29;--line2:#3D3B36;--accent:#4FA57A;--accent-h:#5DB487;--accent-soft:#1F3328;--on-accent:#0E1A13;--pia:#A595F2;--pia-soft:#27223F;--pia-line:#4A3F86;--amber:#E2A84B;--amber-soft:#3A2E17;--red:#EE8A7E;--red-soft:#3D201C;--blue:#8DB4E4;--blue-soft:#1C2A3B;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1{font:400 34px/1.15 var(--serif);letter-spacing:-.01em;margin:2px 0 6px}
h2{font:500 22px/1.25 var(--serif);margin:0 0 8px}
h3{font-size:15px;font-weight:600;margin:0 0 6px}
p{margin:6px 0}
a{color:inherit;cursor:pointer}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-family:ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;align-items:center} .between{justify-content:space-between} .end{justify-content:flex-end} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .nowrap{white-space:nowrap} .small-gap{gap:4px;margin-top:6px}
.mt4{margin-top:4px} .mt12{margin-top:12px} .stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.badc{color:var(--red)} .okc{color:var(--accent)}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 24px;height:56px;background:var(--surface);border-bottom:1px solid var(--line)}
.top-l,.top-r{display:flex;align-items:center;gap:20px;min-width:0}
.top-r{gap:10px}
.brand{font:500 20px var(--serif);letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
.tabsnav{display:flex;gap:2px;height:56px}
.tabsnav a{display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--muted);font-weight:500;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tabsnav a:hover{color:var(--ink)} .tabsnav a.on{color:var(--ink);border-color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600}
.icon.menu{display:none}
.search{position:relative}
.search input{width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.sres{position:absolute;right:0;top:40px;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 10px 30px rgba(0,0,0,.1);padding:6px;display:flex;flex-direction:column;z-index:40}
.sres a{padding:8px;border-radius:var(--r);text-decoration:none;display:flex;gap:8px;align-items:center} .sres a:hover{background:var(--soft)}
.bell{position:relative} .dotn{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:8px;font-size:10px;padding:0 4px}
.who{display:flex;align-items:center;gap:6px} .who select{border:1px solid var(--line);border-radius:var(--r);padding:6px 6px;background:var(--surface);max-width:230px}

main{max-width:1360px;margin:0 auto;padding:28px 24px 140px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.eyebrow,.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lbl{margin:12px 0 6px} .card>.lbl:first-child,.card>.row:first-child .lbl{margin-top:0}
.crumbs{font-size:13px;margin-bottom:6px;color:var(--muted)}
.sect{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:13px;letter-spacing:.02em}
.count{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--soft);color:var(--ink2);font-size:11px;font-weight:600}

/* links */
.ent{color:var(--ink);text-decoration:none;font-weight:500;border-bottom:1px solid transparent}
.ent:hover{border-bottom-color:currentColor}
.ent.subtle{font-weight:400;color:inherit}
.hasprev{position:relative}
.prev{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:35;min-width:220px;padding:10px 12px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 10px 30px rgba(0,0,0,.12);font-weight:400;color:var(--ink);white-space:nowrap}
.hasprev:hover .prev{display:flex;animation:fadein .15s .45s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:7px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .btn.primary:hover{background:var(--accent-h)}
.btn.pia{background:var(--pia-soft);border-color:var(--pia-line);color:var(--pia)} .btn.pia:hover{background:var(--pia-line)}
.btn.pia.ghost{background:transparent}
.btn.big{padding:10px 20px;font-size:15px} .btn.small{padding:4px 10px;font-size:12.5px} .btn.full{width:100%;margin:4px 0;justify-content:flex-start;white-space:normal;text-align:left} .btn.ghost{background:transparent}
.icon{border:1px solid var(--line);background:var(--surface);min-width:30px;height:30px;border-radius:var(--r);cursor:pointer;display:inline-grid;place-items:center}
.icon.ok:hover{background:var(--accent-soft);color:var(--accent)} .icon.no:hover{background:var(--red-soft);color:var(--red)}
.spark{font-size:.95em}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink2);font-size:12px;font-weight:500;white-space:nowrap}
.chip.green{background:var(--accent-soft);color:var(--accent)} .chip.warn{background:var(--amber-soft);color:var(--amber)} .chip.red{background:var(--red-soft);color:var(--red)} .chip.blue{background:var(--blue-soft);color:var(--blue)} .chip.pia{background:var(--pia-soft);color:var(--pia)}
.chip.big{font-size:14px;padding:6px 12px}

/* cards, grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:12px}
.card.flush{padding:0;overflow:auto} .card.soft{background:var(--sunk)} .card.click{cursor:pointer;text-align:left;width:100%} .card.click:hover{border-color:var(--line2)}
.card.blocked{border-color:var(--red)}
.pia-card{border-left:3px solid var(--pia)}
.empty{text-align:center;padding:48px 24px} .empty-s{padding:16px 18px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px} .grid2.wide-l{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cards .card{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0 0 8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font:400 30px/1.1 var(--serif)}
.row-i{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row-i:last-child{border-bottom:0} .row-i.nb{padding:6px 0;border:0} .row-i.click{cursor:pointer} .row-i.click:hover{background:var(--sunk)}
.pia-l{box-shadow:inset 3px 0 var(--pia)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:10px 0;font-size:13px} .kv span{color:var(--muted)} .kv b{font-weight:500}
ul.plain{list-style:none;padding:0;margin:0} ul.plain li{padding:6px 0;border-bottom:1px solid var(--line)} ul.plain li:last-child{border:0}

/* tables */
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--sunk)}
.uc tr.rejected td{opacity:.5} .uc tr.accepted td:first-child{box-shadow:inset 3px 0 var(--accent)}
.uct{font-weight:600}
.tbl textarea,textarea{width:100%;min-width:180px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);resize:vertical}
select{padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pia-row td{background:color-mix(in srgb,var(--pia-soft) 40%,transparent)}
.avs{display:flex} .avs .av{margin-left:-6px;border:2px solid var(--surface)} .avs .av:first-child{margin-left:0}

/* avatars, progress */
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:600;flex:none;vertical-align:middle}
.av.sm{width:22px;height:22px;font-size:9.5px} .av.lg{width:40px;height:40px;font-size:14px} .av.xl{width:64px;height:64px;font-size:22px}
.pbar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:4px 0} .pbar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.mini{display:flex;gap:4px;margin:8px 0 4px} .mini span{flex:1;height:6px;border-radius:3px;background:var(--soft)} .mini .d{background:var(--accent)} .mini .c{background:var(--ink)} .mini .b{background:var(--red)}
.piabar{height:3px;background:var(--pia-soft);overflow:hidden;margin:-8px 0 8px;border-radius:2px} .piabar span{display:block;height:100%;width:30%;background:var(--pia);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* capacity grid */
.cap td{padding:6px} .cap td:first-child{padding:12px 14px}
.cell{width:100%;min-width:70px;border:1px solid transparent;border-radius:var(--r);padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;background:var(--soft)}
.cell b{font-size:13px} .cell span{font-size:11px;color:var(--muted)}
.cell.ok{background:var(--accent-soft)} .cell.ok b{color:var(--accent)}
.cell.short{background:var(--amber-soft);border-color:var(--amber)} .cell.short b{color:var(--amber)}
.cell.bad{background:var(--red-soft);border-color:var(--red)} .cell.bad b{color:var(--red)}
.cell.none{opacity:.5} .cell:disabled{cursor:default}
.tot td{font-weight:600;background:var(--sunk)}

/* pilot workspace */
.pilot-h{align-items:flex-start}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;position:sticky;top:56px;background:var(--bg);z-index:20}
.ptabs a{padding:10px 14px;color:var(--muted);font-weight:500;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.ptabs a:hover{color:var(--ink)} .ptabs a.on{color:var(--ink);border-color:var(--ink)}
.work{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
.work.with-pia{grid-template-columns:minmax(0,1fr) 340px}
.piapanel{position:sticky;top:110px;background:var(--surface);border:1px solid var(--pia-line);border-top:3px solid var(--pia);border-radius:var(--r2);padding:16px;max-height:calc(100vh - 130px);overflow:auto}
.piah{color:var(--pia);font:500 20px var(--serif);margin:0}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:12px} .ov .card{margin:0} .span2{grid-column:span 2}
.person-chip{display:inline-flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);margin:0 6px 6px 0}
.src-chip{display:inline-flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);cursor:pointer;margin:0 6px 6px 0} .src-chip:hover{border-color:var(--line2)}
.banner{padding:10px 14px;border-radius:var(--r2);margin-bottom:12px;border:1px solid}
.banner.good{background:var(--accent-soft);border-color:var(--accent)} .banner.bad{background:var(--red-soft);border-color:var(--red)} .banner.warn{background:var(--amber-soft);border-color:var(--amber)} .banner.pia-b{background:var(--pia-soft);border-color:var(--pia-line);color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px} .fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skel{height:44px;border-radius:var(--r);margin:0 0 10px;background:linear-gradient(90deg,var(--soft),var(--sunk),var(--soft));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* stepper */
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,1fr);gap:8px;position:relative}
.stepper li{display:flex;flex-direction:column;gap:6px;position:relative;padding-top:4px}
.stepper li::before{content:"";position:absolute;top:17px;left:28px;right:-8px;height:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.stepper li.done::before{background:var(--accent)}
.sdot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface);border:2px solid var(--line2);color:var(--muted)}
.done .sdot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.current .sdot{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--soft)}
.blocked .sdot{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.up{opacity:.65}

/* tasks, approvals */
.task{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)} .task:last-child{border:0}
.task.done .ent{text-decoration:line-through;color:var(--muted)}
.tick{width:18px;height:18px;accent-color:var(--accent);flex:none}
.appr{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)} .appr:last-child{border:0}

/* Pia run steps */
.steps{list-style:none;padding:0;margin:12px 0 0}
.st{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.st:first-child{border-top:0}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--soft);color:var(--muted)}
.st.ok.k-ai .dot{background:var(--pia-soft);color:var(--pia)} .st.ok.k-fixed .dot{background:var(--soft);color:var(--ink2)}
.st.warn .dot,.st.stop .dot{background:var(--amber-soft);color:var(--amber)} .st.blocked .dot,.st.error .dot{background:var(--red-soft);color:var(--red)} .st.wait .dot{background:var(--accent-soft);color:var(--accent)}
.st.pending{opacity:.35}
.tool{display:inline-block;margin-top:3px;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;color:var(--pia)}
@keyframes sp{to{transform:rotate(360deg)}}

/* sources */
.src{position:relative;display:inline-block;color:var(--pia);cursor:pointer;font-size:12.5px;font-weight:600;margin-left:2px}
.hovercard{display:none;position:absolute;z-index:30;left:0;top:100%;width:340px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 10px 30px rgba(0,0,0,.14);color:var(--ink);font-weight:400;flex-direction:column;gap:6px;cursor:default;white-space:normal}
.src:hover .hovercard,.src:focus-within .hovercard{display:flex}
.quote{font:15px/1.45 var(--serif)} mark{background:#FFEFA8;color:#151513;padding:0 1px}
.doc{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:8px 0;background:var(--sunk);font:15px/1.55 var(--serif)}
.doctitle{font:600 13px var(--sans);margin-bottom:6px} .docbody[contenteditable]:focus{outline:2px solid var(--pia-line)}
.doc.blur{filter:blur(4px);user-select:none}
.invite{white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,monospace;background:var(--sunk);padding:12px;border-radius:var(--r);border:1px solid var(--line)}
.slots tr.sel td{background:var(--pia-soft)}
.pia-t{color:var(--pia)}
.libcard h3{font:500 18px var(--serif);margin:8px 0 4px}
.people .pcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);font:inherit}

/* panel, modal */
.scrim{position:fixed;inset:0;background:rgba(21,21,19,.4);z-index:50;display:grid;place-items:center;padding:16px} .scrim.light{background:rgba(21,21,19,.15);z-index:44}
.panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;z-index:45;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.1);padding:24px;overflow:auto;animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.panel .close{position:absolute;top:16px;right:16px}
.prof{display:flex;gap:16px;align-items:center;margin-bottom:12px} .prof h2{margin:0}
.parts{margin:8px 0;padding:8px 10px;background:var(--sunk);border-radius:var(--r)}
.transcript{margin-top:8px}
.tline{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px;border-radius:var(--r)} .tline.hl{background:var(--amber-soft);outline:1px solid var(--amber)}
blockquote{margin:6px 0;padding:10px 14px;border-left:3px solid var(--pia);background:var(--pia-soft);font:15px/1.5 var(--serif);border-radius:0 var(--r) var(--r) 0}
.modal{background:var(--surface);border-radius:12px;padding:24px;max-width:580px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.slack{border-left:4px solid #6B4FA0;padding:10px 14px;background:var(--sunk);border-radius:4px;margin:12px 0}

/* simulate panel, toasts */
.demo{position:fixed;left:16px;bottom:16px;z-index:42;width:270px;background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r2);padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.demo.closed{width:170px} .dhead{width:100%;border:0;background:none;padding:0;cursor:pointer}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}

<script>
// Pia: a small agent. One AI step pulls out ideas, then Pia makes three decisions inside a fixed boundary:
//   1. follow up gaps before asking, 2. propose a task owner, 3. choose a fallback when no meeting time works.
// The boundary is enforced here in code: read-only tools only, at most MAX_STEPS tool steps per run, every run versioned,
// repeat triggers skipped, ambiguous deals stopped. People decide everything that gets written.
// The "model" is a mock (MOCK_MODEL in data.js), so this runs offline with no keys.

const PIA_VERSION = "pia-0.3";
const MAX_STEPS = 10;          // tool steps per run
const REPEAT_WINDOW = 600;     // seconds: same deal and stage within 10 minutes is skipped
const TASK_HOURS = 3;          // hours a proposed set-up task books against the owner
const MIN_FREE = 4;            // an owner needs at least this many free hours this week
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
const DAY_DATES = { Mon: "23 Nov", Tue: "24 Nov", Wed: "25 Nov", Thu: "26 Nov", Fri: "27 Nov" };
const MODEL_TOOL = "Anthropic, zero retention";

function clone(x) { return JSON.parse(JSON.stringify(x)); }

function lineAt(cite) {
  if (!cite || !CALLS[cite.call]) return null;
  return CALLS[cite.call].lines[cite.i] || null;
}

// SOURCE CHECK (fixed code): the cited call must have been read, the line must exist and contain the quote.
function sourceCheck(cite, readCalls) {
  if (!cite) return { ok: false, why: "No source sentence given" };
  if (!readCalls.includes(cite.call)) return { ok: false, why: "Cites a call Pia was not allowed to read" };
  const line = lineAt(cite);
  if (!line) return { ok: false, why: "Cited sentence does not exist" };
  if (!line.text.toLowerCase().includes(cite.quote.toLowerCase())) return { ok: false, why: "Quote not found in the cited call" };
  return { ok: true };
}

// INJECTION FLAG (fixed code): sentences that read like instructions are flagged and treated as call text only.
const INJECTION_PATTERNS = [/ignore (all |your )?(previous|prior) instructions/i, /mark (this|the) pilot as approved/i, /you are now/i, /system prompt/i];
function injectionScan(callIds) {
  const found = [];
  for (const id of callIds) CALLS[id].lines.forEach((l, i) => { if (INJECTION_PATTERNS.some(p => p.test(l.text))) found.push({ call: id, i, text: l.text }); });
  return found;
}

const SUCCESS_WORDS = /success|judge|count it|measure/i;

// ---------- Pia's tools. All read-only. There are no write tools. ----------
const TOOLS = {
  readDeal: { readOnly: true, run: pilot => ({ opportunity: pilot.salesforce.opportunity, owner: pilot.salesforce.owner, closeDate: pilot.salesforce.closeDate, notes: pilot.salesforce.notes || [], openDeals: pilot.salesforce.openDeals || [pilot.salesforce.opportunity] }) },
  readCall: { readOnly: true, run: id => CALLS[id] },
  searchCalls: { readOnly: true, run: ({ terms, calls, success }) => {
    const hits = [];
    for (const c of calls) CALLS[c].lines.forEach((l, i) => {
      const t = l.text.toLowerCase();
      if (terms.some(w => t.includes(w.toLowerCase())) && (!success || SUCCESS_WORDS.test(l.text))) hits.push({ call: c, i, quote: l.text, success: SUCCESS_WORDS.test(l.text) });
    });
    return hits.sort((a, b) => b.success - a.success);
  } },
  getFreeBusy: { readOnly: true, run: cal => cal.internal.map(p => ({ name: p.name, busy: p.busy || [] })) },
  getCapacity: { readOnly: true, run: () => PEOPLE.filter(p => p.hours).map(p => ({ name: p.name, specialities: p.specialities, free: p.hours - p.booked })) }
};
class StepLimit extends Error {}

// ---------- SLOT FINDER (fixed code): 08:00 to 18:00 local for everyone; internal free/busy from Google Calendar. ----------
// Firm calendars are not read, only their working hours.
function fitsHours(p, utc) { const s = utc + p.off; return s >= 8 && s + 1 <= 18; }
function isBusy(p, day, utc) { return (p.busy || []).some(([bd, bh]) => bd === day && bh === utc); }
function proposeSlots(group) {
  const people = [...group.internal, ...group.firm];
  if (!people.length) return [];
  const slots = [];
  for (const d of DAYS) for (let utc = 0; utc < 24; utc++) {
    if (!people.every(p => fitsHours(p, utc))) continue;
    if (group.internal.some(p => isBusy(p, d, utc))) continue;
    slots.push({ day: d, date: DAY_DATES[d], utc, local: people.map(p => ({ name: p.name, city: p.city, time: String(utc + p.off).padStart(2, "0") + ":00" })) });
  }
  const byDay = []; const seen = new Set();
  for (const s of slots) if (!seen.has(s.day)) { seen.add(s.day); byDay.push(s); }
  return byDay.slice(0, 3);
}
// SLOT CHECK (fixed code): every proposed slot must sit inside working hours for every attendee and clear internal free/busy.
function slotCheck(session) {
  for (const s of session.slots) {
    for (const p of [...session.internal, ...session.firm]) {
      if (!fitsHours(p, s.utc)) return { ok: false, why: `${s.day} ${s.date} is outside working hours for ${p.name}` };
    }
    for (const p of session.internal) if (isBusy(p, s.day, s.utc)) return { ok: false, why: `${p.name} is busy ${s.day} ${s.date}` };
  }
  return { ok: true };
}
function regionOf(off) { return off >= 5 ? "Asia" : off <= -3 ? "Americas" : "Europe"; }
function cityList(people) { const c = [...new Set(people.map(p => p.city))]; return c.length > 1 ? c.slice(0, -1).join(", ") + " and " + c.at(-1) : c[0]; }

// DECISION 3 (Pia): no time works for everyone. Choose one fallback and say why.
// Split by region when the region that can't make it has firm attendees and someone from ABC Inc. can run a second session;
// otherwise record the session for that region.
function chooseFallback(cal) {
  const all = [...cal.internal, ...cal.firm];
  const regions = [...new Set(all.map(p => regionOf(p.off)))];
  let best = null;
  for (const R of regions) {
    const inR = p => regionOf(p.off) === R;
    const main = { internal: cal.internal.filter(p => !inR(p)), firm: cal.firm.filter(p => !inR(p)) };
    const mainSlots = proposeSlots(main);
    if (!mainSlots.length) continue;
    const away = all.filter(inR);
    if (!best || away.length < best.away.length) best = { R, main, mainSlots, away };
  }
  if (!best) return null;
  const awayFirm = cal.firm.filter(p => regionOf(p.off) === best.R);
  const hosts = cal.internal.filter(p => regionOf(p.off) !== best.R && proposeSlots({ internal: [p, ...cal.internal.filter(x => regionOf(x.off) === best.R)], firm: awayFirm }).length);
  const second = { internal: [...hosts, ...cal.internal.filter(p => regionOf(p.off) === best.R)], firm: awayFirm };
  const secondSlots = hosts.length ? proposeSlots(second) : [];
  const s1 = { key: "a", label: cityList([...best.main.internal, ...best.main.firm]), internal: best.main.internal, firm: best.main.firm, slots: best.mainSlots };
  if (awayFirm.length && secondSlots.length) {
    const s2 = { key: "b", label: cityList([...second.internal, ...second.firm]), internal: second.internal, firm: second.firm, slots: secondSlots };
    return { kind: "split", sessions: [s1, s2],
      why: `${cityList(best.away)} can't join inside 08:00 to 18:00 with ${cityList(best.main.firm)}. ${awayFirm.map(p => p.name).join(" and ")} from the firm ${awayFirm.length > 1 ? "are" : "is"} there, and ${hosts.map(p => p.name).join(" and ")} can run a second session, so Pia chose two sessions by region. A recording was the other option; it suits people who only need to watch.` };
  }
  return { kind: "record", sessions: [s1],
    why: `${cityList(best.away)} can't join inside working hours and no second session fits, so Pia chose to record the session for ${best.away.map(p => p.name).join(" and ")}.` };
}

// ---------- One run. Returns everything the UI needs; writes nothing. ----------
// opts: trigger, kind ("stage" | "call" | "manual"), now (seconds), history (earlier runs), modelDown, extraCalls, maxSteps
function runPia(pilot, opts = {}) {
  const cap = opts.maxSteps || MAX_STEPS;
  const steps = [];
  const add = (kind, label, detail, status = "ok", tool = "") => steps.push({ kind, label, detail, status, tool });
  const model = MOCK_MODEL[pilot.id] || { ideas: [] };
  const out = { piaVersion: PIA_VERSION, status: "waiting", steps, ideas: [], removed: [], questions: [], proposals: [], schedule: null, skipped: [], read: [],
    toolSteps: 0, maxSteps: cap, at: opts.now || 0, stage: pilot.stage, kind: opts.kind || "manual", trigger: opts.trigger || "Deal reached pilot stage in Salesforce" };
  let used = 0;
  const tool = (name, arg) => {
    if (!TOOLS[name] || !TOOLS[name].readOnly) throw new Error("Pia has no tool called " + name);
    if (used >= cap) throw new StepLimit();
    used++; out.toolSteps = used;
    return TOOLS[name].run(arg);
  };

  add("fixed", "Start", out.trigger, "ok", "Salesforce");

  // Repeat trigger for the same deal and stage within 10 minutes: skip and say why.
  if (out.kind === "stage") {
    const prev = (opts.history || []).filter(h => h.kind === "stage" && h.stage === pilot.stage && h.status !== "skipped" && out.at - h.at < REPEAT_WINDOW).at(-1);
    if (prev) {
      add("fixed", "Repeat trigger skipped", `The same deal and stage started run ${prev.version || 1} ${Math.max(1, Math.round((out.at - prev.at) / 60))} min ago. Runs for the same deal and stage within 10 minutes are skipped. Nothing was read or drafted.`, "stop");
      out.status = "skipped"; out.reason = "Same deal and stage within 10 minutes"; return out;
    }
  }

  const allCalls = [...(pilot.calls || []), ...(opts.extraCalls || [])].filter((c, i, a) => a.indexOf(c) === i);
  const consented = allCalls.filter(c => CALLS[c].consent);
  const skipped = allCalls.filter(c => !CALLS[c].consent);
  out.skipped = skipped;
  add("fixed", "Consent check", skipped.length
    ? `Skipped ${skipped.length} call (${skipped.map(c => CALLS[c].source + ", " + CALLS[c].date).join("; ")}): the firm has not agreed to AI processing`
    : `${consented.length} calls, all with the firm's agreement to recording and AI processing`, skipped.length ? "warn" : "ok");

  if (consented.length === 0) {
    add("fixed", "Nothing to read", "No recorded calls Pia is allowed to read. Nothing was drafted.", "stop");
    out.status = "nothing"; return out;
  }

  const inj = injectionScan(consented);
  out.injection = inj;
  add("fixed", "Injection flag", inj.length
    ? `1 sentence reads like an instruction (${CALLS[inj[0].call].source}, ${CALLS[inj[0].call].lines[inj[0].i].t}). Treated as call text, not as an instruction. Nothing was approved.`
    : "No sentence in the calls reads like an instruction", inj.length ? "warn" : "ok");

  if (opts.modelDown) {
    add("ai", "Read the deal", "Model unavailable (no response after 3 tries). The run stopped cleanly. Nothing was drafted or written. Retry when the model is back.", "error", MODEL_TOOL);
    out.status = "failed"; return out;
  }

  try {
    // 2. Read deal and calls
    const deal = tool("readDeal", pilot);
    add("ai", "Read the deal", `${deal.opportunity}, owner ${deal.owner}. ${deal.notes.length} deal notes.`, "ok", "readDeal · Salesforce");
    if (deal.openDeals.length > 1) {
      add("fixed", "Which deal?", `${pilot.firm} has ${deal.openDeals.length} open deals (${deal.openDeals.join("; ")}). The run stopped as ambiguous and drafted nothing. ${pilot.ae} was asked which deal this pilot is for.`, "stop");
      out.status = "ambiguous"; return out;
    }
    for (const c of consented) { tool("readCall", c); out.read.push(c); add("ai", `Read ${CALLS[c].title.toLowerCase()}`, `${CALLS[c].date}, ${CALLS[c].length}, ${CALLS[c].lines.length} sentences`, "ok", "readCall · " + CALLS[c].source); }

    const ex = LEARNING.examples[pilot.practice];
    if (ex) add("ai", "Use examples", `Used ${ex.n} approved ideas from past ${ex.label} pilots as examples`, "ok", "Learning store");

    // 3. Pull out ideas (the one AI step; mock model sees only read calls)
    const raw = model.ideas.filter(c => !c.needs || consented.includes(c.needs));
    add("ai", "Pull out ideas", `${raw.length} ideas: what the firm asked for, in the firm's words, each with the sentence it came from`, "ok", MODEL_TOOL);

    // 4. Source check
    for (const c of raw) {
      const chk = sourceCheck(c.cite, consented);
      if (!chk.ok) { out.removed.push({ id: c.id, text: c.text, why: chk.why }); continue; }
      const sq = c.successQuote && sourceCheck(c.successQuote, consented).ok ? clone(c.successQuote) : null;
      out.ideas.push({ id: c.id, topic: c.topic, text: c.text, practice: c.practice, cite: clone(c.cite), clarity: c.clarity, successQuote: sq, terms: c.terms,
        followUp: null, status: "open", name: "", mergeInto: null, edited: false, original: c.text });
    }
    add("fixed", "Source check", out.removed.length
      ? `${out.ideas.length} kept. Removed ${out.removed.length}: "${out.removed.map(r => r.text).join('", "')}" (${out.removed.map(r => r.why.toLowerCase()).join("; ")})`
      : `All ${out.ideas.length} ideas point to a real sentence in the calls`, out.removed.length ? "warn" : "ok");

    // 5. Decision 1: follow up gaps before asking
    for (const idea of out.ideas) {
      const vague = idea.clarity === "vague"; if (!vague && idea.successQuote) continue;
      const others = consented.filter(c => c !== idea.cite.call);
      const hits = tool("searchCalls", { terms: idea.terms, calls: others, success: !vague }).filter(h => sourceCheck(h, consented).ok);
      const noteHit = deal.notes.find(n => idea.terms.some(w => n.toLowerCase().includes(w.toLowerCase())) && (vague || SUCCESS_WORDS.test(n)));
      const where = `Looked in ${others.length} other call${others.length === 1 ? "" : "s"} and the deal notes`;
      const gap = vague ? "Not clear what the firm wants" : "No success measure in the same call";
      if (hits.length) {
        const h = hits[0]; const l = lineAt(h);
        idea.followUp = { cite: { call: h.call, i: h.i, quote: h.quote }, from: CALLS[h.call].title, at: l.t };
        if (h.success && !idea.successQuote) idea.successQuote = { call: h.call, i: h.i, quote: h.quote };
        if (vague) idea.clarity = "clear";
        add("decision", `Follow up: ${idea.topic}`, `${gap}. ${where}; found in ${CALLS[h.call].title} (${CALLS[h.call].source}, ${l.t}). Quote attached.`, "ok", "searchCalls");
      } else if (noteHit) {
        idea.followUp = { note: noteHit, from: "Deal notes" };
        if (vague) idea.clarity = "clear";
        add("decision", `Follow up: ${idea.topic}`, `${gap}. ${where}; found in the deal notes.`, "ok", "searchCalls");
      } else {
        out.questions.push({ id: "q-" + idea.id, ideaId: idea.id, cite: clone(idea.cite), asked: false, answer: "",
          text: vague ? `The calls say "${idea.cite.quote}" but not what they would use it for. Which tasks do they want to test?` : `How would the firm judge "${idea.text.toLowerCase()}"? The calls don't say what would count as a success.` });
        add("decision", `Follow up: ${idea.topic}`, `${gap}. ${where}; not found, question added for ${pilot.ae} to ask the firm.`, "warn", "searchCalls");
      }
    }

    // 6. Decision 2: one Legal Engineer task per idea, with a proposed owner
    const caps = tool("getCapacity");
    add("ai", "Check capacity", `${caps.length} Legal Engineers, free hours this week`, "ok", "getCapacity · PilotHQ");
    const free = Object.fromEntries(caps.map(p => [p.name, p.free]));
    for (const idea of out.ideas) {
      if (idea.clarity === "vague") continue; // wait for the firm's answer before proposing work
      const cands = caps.filter(p => p.specialities.includes(idea.practice)).sort((a, b) => free[b.name] - free[a.name]);
      const best = cands[0];
      const task = { id: "task-" + idea.id, ideaId: idea.id, title: `Configure ${idea.topic} for the pilot`, due: "Tue 24 Nov", dueNote: "before kickoff on 25 Nov", hours: TASK_HOURS, practice: idea.practice };
      if (best && free[best.name] >= MIN_FREE) {
        out.proposals.push({ ...task, owner: best.name, freeAt: free[best.name], reason: `${idea.practice}, ${free[best.name]} h free` });
        free[best.name] -= TASK_HOURS;
      } else {
        out.proposals.push({ ...task, owner: null, flag: `No one with ${idea.practice} has time this week`,
          reason: cands.length ? cands.map(c => `${c.name} ${free[c.name]} h free`).join(", ") : `No Legal Engineer lists ${idea.practice}` });
      }
    }
    const flagged = out.proposals.filter(p => !p.owner);
    add("decision", "Propose task owners", out.proposals.map(p => `${p.title}: ${p.owner ? `${p.owner} (${p.reason})` : "no owner"}`).join(". ") + "." +
      (flagged.length ? ` ${flagged.map(f => f.flag).join("; ")}. Flagged to ${ROLES.esm.name}.` : " Every task has an owner with time."), flagged.length ? "warn" : "ok", "Specialities and free hours");

    // 7 and 8. Slots, then Decision 3 if no time works
    if (pilot.calendar) {
      const cal = pilot.calendar;
      tool("getFreeBusy", cal);
      add("ai", "Read free/busy", `${cal.internal.map(p => p.name).join(", ")} (ABC Inc.). Firm calendars are not read, only working hours.`, "ok", "getFreeBusy · Google Calendar");
      const everyone = [...cal.internal, ...cal.firm];
      const direct = proposeSlots(cal);
      if (direct.length) {
        add("fixed", "Slot finder", `${direct.length} slots inside 08:00 to 18:00 for ${cityList(everyone)} and ABC Inc. free/busy`);
        out.schedule = { fallback: null, sessions: [{ key: "a", label: cityList(everyone), internal: cal.internal, firm: cal.firm, slots: direct }] };
      } else {
        add("fixed", "Slot finder", `No time works for ${cityList(everyone)} inside 08:00 to 18:00 local`, "warn");
        const fb = chooseFallback(cal);
        if (fb) {
          out.schedule = { fallback: fb.kind, why: fb.why, sessions: fb.sessions };
          add("decision", "No time works", (fb.kind === "split" ? "Split by region: " + fb.sessions.map(s => `${s.label}, ${s.slots[0].day} ${String(s.slots[0].utc).padStart(2, "0")}:00 London`).join("; ") + ". " : "Record it. ") + fb.why, "ok", "Fallback");
        } else add("decision", "No time works", "No fallback fits. Left for the Account Executive to arrange.", "warn");
      }
      if (out.schedule) {
        const checks = out.schedule.sessions.map(slotCheck);
        const bad = checks.find(c => !c.ok);
        const n = out.schedule.sessions.reduce((a, s) => a + s.slots.length, 0);
        add("fixed", "Slot check", bad ? bad.why : `All ${n} proposed slots are inside working hours and clear on free/busy`, bad ? "blocked" : "ok");
      }
    }
  } catch (e) {
    if (!(e instanceof StepLimit)) throw e;
    add("fixed", "Stopped at the step limit", `Used ${used} of ${cap} tool steps. Stopped cleanly and kept what was drafted: ${out.ideas.length} ideas, ${out.questions.length} questions. Nothing was written.`, "stop");
    out.status = "stopped"; return out;
  }

  add("person", "Waiting for people", `${pilot.les[0]} keeps, merges or drops the ideas. ${ROLES.esm.name} confirms task owners.${out.schedule ? ` ${pilot.ae} picks slots and sends the invite.` : ""} Nothing is written until each person confirms their part.`, "wait");
  return out;
}

// Re-run before Tom confirms: keep people's decisions and edits, add new items, mark what changed.
function mergeRun(prev, next) {
  const changes = [];
  for (const u of next.ideas) {
    const old = prev.ideas.find(x => x.id === u.id);
    if (!old) { u.change = "new"; changes.push(`New idea: ${u.topic}`); continue; }
    Object.assign(u, { status: old.status, name: old.name, mergeInto: old.mergeInto, edited: old.edited });
    if (old.edited) { u.text = old.text; u.change = "kept"; }
    if (!old.followUp && u.followUp) { u.change = "found"; changes.push(`Found in ${u.followUp.from}: ${u.topic}`); }
  }
  for (const q of next.questions) { const oq = prev.questions.find(x => x.id === q.id); if (oq) Object.assign(q, { asked: oq.asked, answer: oq.answer }); }
  for (const q of prev.questions.filter(g => !next.questions.some(x => x.id === g.id))) changes.push(`Question closed: ${(prev.ideas.find(i => i.id === q.ideaId) || {}).topic || q.text.slice(0, 40)}`);
  for (const p of next.proposals) if (!prev.proposals.some(x => x.id === p.id)) changes.push(`New task proposed: ${p.title}`);
  next.changes = changes;
  return next;
}

// What each person's confirmation writes. Each confirm writes only its own piece. Called only from confirm actions.
function confirmWrites(piece, pilot, run, extra = {}) {
  const channel = `#pilot-${pilot.id}-${pilot.firm.split(" ")[0].toLowerCase()}`;
  if (piece === "ideas") {
    const kept = run.ideas.filter(u => u.status === "kept");

      { target: "Notion", what: `Pilot plan "${pilot.firm}: pilot plan" with ${kept.length} use cases named by ${extra.by || pilot.les[0]} and ${run.questions.length} open questions for the firm` },
      { target: "Slack", what: `Summary posted to ${channel}` }
    ];
  }
  if (piece === "owners") {
    const owned = (extra.tasks || []).filter(t => t.owner);
    return [{ target: "PilotHQ", what: `${owned.length} tasks added to My work for ${[...new Set(owned.map(t => t.owner))].join(", ") || "nobody"}` }];
  }
  if (piece === "assign") return [{ target: "PilotHQ", what: `Task "${extra.title}" added to My work for ${extra.owner}` }];
  return [];
}

function canView(roleKey, pilot) {
  if (roleKey === "esm") return true;
  if (roleKey === "aie") return false; // AI Enablement sees run logs and tests, not pilot content
  return pilot.team.includes(ROLES[roleKey].name);
}

    if (r.schedule.sessions.every(x => S.sent[pid][x.key])) S.done.t4 = true;
    toast("Marked as sent."); render();
  },
  task(id) { S.done[id] = !S.done[id]; const t = tasks().find(x => x.id === id); log(t.pid, me(), "confirm", `${S.done[id] ? "Completed" : "Reopened"} task: ${t.title}`); if (S.done[id]) toast("Task done.", "", () => { S.done[id] = false; }); render(); },
  agenda() { S.modal = { kind: "agenda" }; log("hv", PIA_ACTOR, "draft", "Drafted the kickoff agenda from the agreed plan"); render(); },
  closeModal() { S.modal = null; render(); },
  ap(id, verdict) {
    const it = approvals().find(x => x.id === id); if (!it) return; S.apDone[id] = verdict;
    if (verdict === "approved" && it.apply) it.apply();
    log(it.pid, me(), "confirm", `${verdict === "approved" ? "Approved" : "Rejected"}: ${it.text}`);
    if (id === "staff-cr") S.done.t10 = true;
    toast(verdict === "approved" ? "Approved." : "Rejected."); render();
  },
  apFilter(f) { S.apFilter = f; render(); },
  assign(pid, w) { S.modal = { kind: "assign", pid, w }; render(); },
  confirmAssign(who) {
    const { pid, w } = S.modal; const c = capacity(pid)[w]; const flags = w === 0 ? openFlags(pid) : [];
    addCap(pid, w, c.need - c.staffed, who, flags.length > 0);
    for (const f of flags) assignFlagCore(pid, f.id, who);
    S.modal = null; toast(`${who} assigned to ${pilot(pid).firm}${flags.length ? ", with the flagged task" : ""}.`); render();
  },
  priority(pid, el) { S.priority[pid] = el.value; log(pid, me(), "edit", "Priority set to " + el.value); toast("Priority updated."); },
  actFilter(f) { S.actFilter = f; render(); },
  digest(i) { S.modal = { kind: "digest", i }; render(); },
  search(el) { S.q = el.value; renderSearch(); },
  runChecks() { S.acResults = runAcceptanceChecks(); render(); },
  runTests() { S.testRun = { n: 0 }; render(); const t = setInterval(() => { S.testRun.n++; if (S.testRun.n >= TEST_SET.length) { clearInterval(t); S.testRun.done = true; } render(); }, 80); },
  undo(id) { const t = S.toasts.find(x => String(x.id) === String(id)); if (t && t.undo) t.undo(); S.toasts = S.toasts.filter(x => x !== t); render(); },
  slack() { toast("Opens Slack in the real app."); }
};

function startRun(pid, opts) {
  const p = pilot(pid); const prev = run(pid);
  let r = runPia(p, { trigger: opts.trigger, kind: opts.kind, now: S.clock, history: S.runs[pid] || [], modelDown: S.modelDown });
  if (r.status === "skipped") {
    S.skips.push({ pid, r }); for (const st of r.steps) { const a = stepAudit(pid, st); log(pid, a.actor, a.type, a.text); }
    toast("Repeat trigger skipped: same deal and stage within 10 minutes."); render(); return;
  }
  if (opts.merge && prev && prev.status === "waiting" && r.status === "waiting") r = mergeRun(clone(prev), r);
  r.version = (S.runs[pid] || []).length + 1;
  S.runs[pid] = (S.runs[pid] || []).concat(r);
  S.anim = { pid, shown: 0 }; S.piaOpen = true; render();
  const t = setInterval(() => {
    const st = r.steps[S.anim.shown]; const a = stepAudit(pid, st); log(pid, a.actor, a.type, a.text);
    S.anim.shown++;
    if (S.anim.shown >= r.steps.length) {
      clearInterval(t); S.anim = null;
      if (r.status === "waiting") toast(r.changes && r.changes.length ? `Pia updated the ideas: ${r.changes.length} changes.` : "Pia's ideas and proposals are ready for people to decide.", "pia");
      if (r.status === "failed") toast("Run stopped cleanly. Nothing was written.", "bad");
      if (r.status === "stopped") toast("Stopped at the step limit. Nothing was written.", "bad");
    }
    render();
  }, 420);
}

// ---------- routing ----------
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!parts.length) { location.replace("#/" + LANDING[S.role]); return; }
  const prev = S.r.join("/");
  S.r = parts; S.navOpen = false;
  if (parts[0] === "pilots" && parts[1]) {
    const p = pilot(parts[1]);
    if (p && !canView(S.role, p) && !prev.startsWith("pilots/" + parts[1])) log(p.id, me(), "access", `Access denied: ${me()} is not on the deal team`);
  }
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (S.modal) A.closeModal(); else if (S.panel) A.close(); } });

  if (!conf(p.id).ideas) return "None yet";
  const k = run(p.id).ideas.filter(u => u.status === "kept");
  return `0 of ${k.length} agreed · ${k.filter(u => u.successQuote).length} with the firm's words`;
}

// ---------- Pilot workspace ----------
function pilotView(pid, tab) {
  const p = pilot(pid);
  if (!p) return `<div class="empty card"><h3>Pilot not found</h3></div>`;
  if (!canView(S.role, p)) return `<div class="empty card"><h2>You don't have access to this pilot</h2><p class="muted">${esc(me())} is not on the deal team, so PilotHQ shows nothing about it. Pia's service account only reads the deal team's records. This attempt is in the activity log.</p><button class="btn" onclick="go('${LANDING[S.role]}')">Back</button></div>`;
  const r = run(pid); const anim = S.anim && S.anim.pid === pid; const ok = ready(pid);
  let action = "";
  if (conf(pid).ideas) action = chip("✓ Plan agreed by " + esc(conf(pid).ideas.by), "green big");
  else if (ok && me() === p.les[0]) { const prob = ideasProblem(r); action = `<button class="btn primary big" ${prob ? "disabled" : ""} onclick="A.confirmIdeas()">Confirm ideas</button>${prob ? `<div class="small muted">${esc(prob)}</div>` : ""}`; }
  else if (ok) action = `<span class="small muted">Waiting for ${pl(p.les[0])} to confirm the ideas</span>`;
  const count = k => {
    if (k === "progress") { const n = tasks().filter(t => t.pid === pid && !S.done[t.id] && t.stage === stageOf(pid)).length; return n || ""; }
    if (!ok) return ""; if (k === "ideas") return r.ideas.length; if (k === "gaps") return r.questions.filter(q => !q.answer).length || ""; if (k === "schedule") return r.schedule ? r.schedule.sessions.length : ""; return "";
  };
  const tabName = (PILOT_TABS.find(t => t[0] === tab) || [0, "Overview"])[1];
  const showPia = S.piaOpen && !p.static;
  return `<div class="crumbs"><a class="ent subtle" onclick="go('pilots')">${S.role === "esm" ? "Portfolio" : "Pilots"}</a> / ${fl(pid)} / <span class="muted">${tabName}</span></div>
  <div class="ph pilot-h"><div><h1>${esc(p.firm)}</h1>
    <div class="row wrap small muted">${chip(esc(STAGES[stageOf(pid)]))}<span>${esc(p.region)}</span>·<span>${p.users} users</span>·<span>${p.days} days</span>·<span>AE ${pl(p.ae)}</span>·<span>LE ${p.les.map(n => pl(n)).join(", ")}</span></div></div>
    <div class="actions">${action}${p.static ? "" : `<button class="btn pia ghost" onclick="A.pia()" aria-expanded="${S.piaOpen}">${PIA} ${S.piaOpen ? "Hide" : "Show"} Pia</button>`}</div></div>
  ${anim ? `<div class="piabar" aria-label="Pia is working"><span></span></div>` : ""}
  <nav class="ptabs" role="tablist">${PILOT_TABS.map(([k, l]) => `<a role="tab" tabindex="0" aria-selected="${tab === k}" class="${tab === k ? "on" : ""}" onclick="go('pilots/${pid}/${k}')" onkeydown="if(event.key==='Enter')go('pilots/${pid}/${k}')">${l}${count(k) !== "" ? ` <span class="count">${count(k)}</span>` : ""}</a>`).join("")}</nav>
  ${ok && r.changes && r.changes.length && !conf(pid).ideas ? `<div class="banner pia-b">${PIA} <b>Pia re-read the calls after the follow-up call.</b> Your decisions and edits were kept. ${r.changes.map(esc).join(" · ")}</div>` : ""}
  <div class="work ${showPia ? "with-pia" : ""}"><section class="tabbody">${tabBody(p, r, anim, tab)}</section>${showPia ? `<aside class="piapanel">${piaPanel(p, r, anim)}</aside>` : ""}</div>`;
}

function tabBody(p, r, anim, tab) {
  if (tab === "overview") return overviewTab(p, r);
  if (tab === "progress") return progressTab(p);
  if (tab === "team") return teamTab(p);
  if (tab === "activity") return activityTab(p);
  if (p.static) return `<div class="empty card"><h3>Set up by hand</h3><p class="muted">This pilot was set up before Pia. See Progress and Team.</p></div>`;
  if (anim) return `<div class="card">${[1, 2, 3, 4].map(() => `<div class="skel"></div>`).join("")}<p class="small muted">${PIA} Pia is reading the calls. Nothing shows until the source check has run.</p></div>`;
  const st = runStatusCard(r); if (st) return st;
  if (tab === "ideas") return ideasTab(p, r);
  if (tab === "gaps") return gapsTab(p, r);
  if (tab === "schedule") return scheduleTab(p, r);
  return "";
}
function runStatusCard(r) {
  if (!r) return `<div class="empty card"><h3>Nothing from Pia yet</h3><p class="muted">Pia reads the calls when the deal reaches pilot stage in Salesforce.</p></div>`;
  if (r.status === "nothing") return `<div class="empty card"><h3>Nothing to read</h3><p class="muted">This pilot has no recorded calls Pia is allowed to read, so Pia drafted nothing rather than guessing.</p></div>`;
  if (r.status === "failed") return `<div class="empty card"><h3>Pia's run stopped</h3><p class="muted">The model did not respond. Nothing was half-written. ${S.role === "le" ? "Try again from the Pia panel." : "The Legal Engineer has been told to retry."}</p></div>`;
  if (r.status === "ambiguous") return `<div class="empty card"><h3>Which deal is this pilot for?</h3><p class="muted">The firm has more than one open deal, so Pia stopped and drafted nothing. The Account Executive has been asked.</p></div>`;
  if (r.status === "stopped") return `<div class="empty card"><h3>Stopped at the step limit</h3><p class="muted">Pia used all ${r.maxSteps} tool steps and stopped cleanly. What was drafted is kept in the Pia panel. Nothing was written.</p></div>`;
  return "";
}

function overviewTab(p, r) {
  const pr = PROGRESS[p.id]; const s = stageOf(p.id); const f = FIRMS[p.id]; const ok = ready(p.id);
  const kept = ok && conf(p.id).ideas ? r.ideas.filter(u => u.status === "kept") : [];
  const next = tasks().filter(t => t.pid === p.id && !S.done[t.id]).slice(0, 4);
  const qs = ok ? r.questions : [];
  const isAE = me() === p.ae;
  return `<div class="ov">
   <div class="card"><div class="lbl">How it's tracking</div>${miniStepper(p.id)}
     <div class="kv"><span>Stage</span><b>${esc(STAGES[s])}</b><span>Days left</span><b>${pr.daysLeft}</b><span>Firm decides</span><b>${esc(pr.decision)}</b><span>Success criteria</span><b>${esc(criteriaSummary(p))}</b><span>Questions for the firm</span><b>${qs.length ? `${qs.filter(q => q.asked).length} of ${qs.length} asked` : "0"}</b><span>Risk</span><b>${riskChip(riskOf(p)[0])}</b></div>
     <a class="ent small" onclick="go('pilots/${p.id}/progress')">Progress and checklist →</a></div>
   <div class="card"><div class="lbl">Firm</div><h3>${fl(p.id)}</h3><p class="small">${esc(f.about)}</p>
     <div class="kv"><span>HQ</span><b>${esc(f.hq)}</b><span>Offices</span><b>${f.offices.map(esc).join(", ")}</b><span>Lawyers</span><b>${f.lawyers}</b><span>Pilot</span><b>${p.users} users · ${p.days} days</b>${(S.role === "ae" || S.role === "esm") && p.salesforce ? `<span>Deal</span><b>${esc(p.salesforce.amount)}</b>` : ""}</div></div>
   <div class="card"><div class="row between"><div class="lbl">What's agreed</div>${kept.length ? chip("✓ Agreed by " + esc(conf(p.id).ideas.by), "green") : ""}</div>${p.static ? (pr.criteria || []).map(c => `<p class="small">• ${esc(c[0])}</p>`).join("") : kept.length ? `<ul class="plain">${kept.map(u => `<li><a class="ent" onclick="A.idea('${u.id}')">${esc(u.name)}</a><div class="small muted">${esc(u.practice)} · ${u.successQuote ? "the firm said: “" + esc(u.successQuote.quote) + "”" : "success measure to agree with the firm"}</div></li>`).join("")}</ul>` : ok ? `<p class="small">${r.ideas.length} ideas from the calls are waiting for ${pl(p.les[0])}.</p><a class="ent small" onclick="go('pilots/${p.id}/ideas')">See the ideas →</a>` : `<p class="small muted">Nothing agreed yet.</p>`}</div>
   <div class="card ${qs.length ? "pia-card" : ""}"><div class="row between"><div class="lbl">Questions for the firm</div>${qs.length ? chip(PIA + " Pia looked first", "pia") : ""}</div>
     ${qs.length ? qs.map(q => `<div class="qrow"><p class="small">${esc(q.text)} ${srcLink(q.cite, "icon")}</p>
       <div class="row wrap">${q.asked ? chip("✓ Asked", "green") : chip("Not asked yet")}${isAE ? `<button class="btn small" onclick="A.ask('${q.id}')">${q.asked ? "Undo" : "Mark asked"}</button>` : ""}</div>
       ${isAE && q.asked ? `<input class="ans" aria-label="The firm's answer" placeholder="The firm's answer" value="${esc(q.answer)}" onchange="A.answer('${q.id}',this)">` : q.answer ? `<p class="small"><b>Answer:</b> ${esc(q.answer)}</p>` : ""}</div>`).join("") : `<p class="small muted">${ok ? "None. Pia found everything it needed in the calls." : "Pia lists questions here when the calls don't cover something."}</p>`}</div>
   <div class="card"><div class="lbl">What's next</div>${next.map(t => `<div class="row-i nb"><a class="ent small" onclick="go('pilots/${p.id}/progress')">${esc(t.title)}</a><span class="row small muted nowrap">${esc(t.due)} ${av(t.owner, "sm")}</span></div>`).join("") || `<p class="small muted">No open tasks.</p>`}</div>
   <div class="card ${ok && r.proposals.length && !conf(p.id).owners ? "pia-card" : ""}"><div class="row between"><div class="lbl">Tasks for Legal Engineering</div>${ok && r.proposals.length ? (conf(p.id).owners ? chip("✓ Owners confirmed by " + esc(conf(p.id).owners.by), "green") : chip(PIA + " Owners proposed by Pia", "pia")) : ""}</div>
     ${ok && r.proposals.length ? liveProposals(p.id).map(pr => { const o = ownerOf(p.id, pr) || (S.assigned[p.id] || {})[pr.id]; return `<div class="row-i nb"><span class="small">${esc(pr.title)}</span><span class="small nowrap">${o ? pl(o) : chip("▲ No owner", "warn")}</span></div>`; }).join("") + (conf(p.id).owners ? "" : `<p class="small muted">Waiting for ${pl(ROLES.esm.name)} to confirm.</p>`) : `<p class="small muted">None proposed yet.</p>`}</div>
   <div class="card span2"><div class="row between"><div class="lbl">Team</div><a class="ent small" onclick="go('pilots/${p.id}/team')">Workstreams and DRIs →</a></div><div class="row wrap">${p.team.map(n => `<span class="person-chip">${pl(n, true)}<span class="small muted">${esc(PERSON[n] ? PERSON[n].title : "")}</span></span>`).join("")}</div></div>
   <div class="card span2"><div class="lbl">Sources Pia reads</div><div class="row wrap">${SOURCES.map(([n, what, t]) => `<button class="src-chip" onclick="S.actFilter='${n}';go('pilots/${p.id}/activity')"><b>${n}</b><span class="small muted">${what} · ${t}</span></button>`).join("")}</div></div>
   <div class="card span2 later"><div class="lbl">Later, if Legal Engineering wants it</div><div class="row wrap">${LATER.map(x => `<button class="btn pia" disabled title="Coming later" aria-label="${esc(x)}, coming later">${PIA} ${esc(x)}</button>`).join("")}</div></div>
  </div>`;
}
function miniStepper(pid) { const s = stageOf(pid); const bl = PROGRESS[pid].blocked; return `<div class="mini" aria-label="Stage ${s + 1} of ${STAGES.length}">${STAGES.map((st, i) => `<span class="${i < s ? "d" : i === s ? (bl ? "b" : "c") : ""}" title="${esc(st)}"></span>`).join("")}</div>`; }

function progressTab(p) {
  const pr = PROGRESS[p.id]; const s = stageOf(p.id);
  const dates = p.id === "hv" ? pr.dates.map((d, i) => (i === 1 || i === 2) && !run("hv") ? "Planned" : d) : pr.dates;
  const cl = tasks().filter(t => t.pid === p.id && t.stage === s);
  const r = run(p.id);
  const crit = pr.criteria || (conf(p.id).ideas ? r.ideas.filter(u => u.status === "kept").map(u => [`${u.name}: ${u.successQuote ? "the firm said “" + u.successQuote.quote + "”" : "measure to agree"}`, "Not agreed"]) : []);
  const warn = ["hv", "lh", "cr"].includes(p.id);
  return `<div class="card"><ol class="stepper">${STAGES.map((st, i) => { const state = i < s ? "done" : i === s ? (pr.blocked ? "blocked" : "current") : "up"; return `<li class="${state}"><span class="sdot">${state === "done" ? "✓" : state === "blocked" ? "!" : i + 1}</span><div><b>${esc(st)}</b><div class="small muted">${esc(dates[i] || "")}</div><div class="small">${pr.owners[i] && PERSON[pr.owners[i]] ? pl(pr.owners[i]) : esc(pr.owners[i] || "")}</div></div></li>`; }).join("")}</ol>
    <div class="row wrap small mt12">${chip(pr.daysLeft + " days left")}<span>Readout ${esc(pr.readout)}</span>·<span>Firm decides ${esc(pr.decision)}</span></div>
    ${warn ? `<div class="banner warn small mt12">The readout is less than two weeks before the firm decides. Consider moving it earlier.</div>` : ""}</div>
  <div class="grid2"><section><h3 class="sect">Checklist: ${esc(STAGES[s])} <span class="count">${cl.filter(t => !S.done[t.id]).length} open</span></h3>
   <div class="card flush">${cl.map(taskRow).join("") || `<div class="empty-s">No tasks for this stage.</div>`}</div></section>
   <section><h3 class="sect">Success criteria</h3><div class="card flush">${crit.map(([c, st]) => `<div class="row-i"><span class="small">${esc(c)}</span>${chip(st, st === "Met" ? "green" : st === "On track" ? "blue" : st === "At risk" ? "red" : "")}</div>`).join("") || `<div class="empty-s">The Legal Engineer agrees these with the firm once the plan is agreed.</div>`}</div></section></div>`;
}

function teamTab(p) {
  const ws = WORKSTREAMS[p.id] || [];
  const nextFor = n => tasks().find(t => t.pid === p.id && t.owner === n && !S.done[t.id]);
  return `<p class="small muted">Who owns each workstream on this pilot.</p><div class="card flush"><table class="tbl"><thead><tr><th>Workstream</th><th>DRI</th><th>Side</th><th>Status</th><th>Next task</th><th>Due</th></tr></thead><tbody>
  ${ws.map(([w, n]) => { const t = nextFor(n); const pe = PERSON[n]; return `<tr><td><b>${esc(w)}</b></td><td>${pl(n, true)}<div class="small muted">${esc(pe ? pe.title : "")}</div></td><td>${pe && pe.org === "ABC Inc." ? chip("ABC Inc.") : chip("Firm", "warn")}</td><td>${t ? chip("In progress", "blue") : chip("On track", "green")}</td><td class="small">${t ? esc(t.title) : `<span class="muted">Nothing open</span>`}</td><td class="small nowrap">${t ? esc(t.due) : ""}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}

function activityTab(p) {
  const f = S.actFilter;
  const filters = ["All", "Pia", "Decisions", "Checks", "People", "Digests", ...SOURCES.map(s => s[0])];
  let rows = S.audit.filter(e => e.pid === p.id);
  if (f === "Pia") rows = rows.filter(e => e.actor.startsWith("Pia"));
  else if (f === "Decisions") rows = rows.filter(e => e.type === "decision" || e.type === "confirm");
  else if (f === "Checks") rows = rows.filter(e => e.type === "check");
  else if (f === "People") rows = rows.filter(e => PERSON[e.actor]);
  else if (f !== "All" && f !== "Digests") rows = rows.filter(e => (e.actor + " " + e.text).includes(f));
  const slack = conf(p.id).ideas ? `<div class="slack"><div class="small muted">#pilot-${p.id}-${p.firm.split(" ")[0].toLowerCase()} · PilotHQ · posted after ${esc(conf(p.id).ideas.by)} confirmed</div><p><b>${esc(p.firm)} pilot plan agreed</b> by ${esc(conf(p.id).ideas.by)}.<br>${run(p.id).ideas.filter(i => i.status === "kept").map(i => "• " + esc(i.name)).join("<br>")}<br>${run(p.id).questions.length} questions for the firm (${esc(p.ae)}). Next: task owners and the first training invites.</p></div>` : "";
  return `<div class="filters">${filters.map(x => `<button class="fchip ${f === x ? "on" : ""}" onclick="A.actFilter('${x}')">${x}</button>`).join("")}</div>
  ${f === "Digests" ? digestsList() : (f === "All" || f === "Slack" ? slack : "") + auditTable(rows, true)}`;
}
function digestsList() {
  return `<div class="row between"><p class="small muted">Weekly digest, posted to #growth-pilots every Monday at 08:00.</p>${piaBtn("Preview next digest", "A.digest(-1)")}</div>
  <div class="card flush">${DIGESTS.map((d, i) => `<div class="row-i click" onclick="A.digest(${i})"><div><b>${d.week}</b><div class="small muted">#growth-pilots · sent ${d.sent} · ${d.items.length} pilots</div></div><span class="ent small">Open</span></div>`).join("")}</div>`;
}
function auditTable(rows, inPilot) {
  const icon = { start: "▶", read: "📖", draft: "✎", check: "✓", decision: "✦", waiting: "…", confirm: "👤", edit: "✎", write: "⤓", access: "⛔" };
  return `<div class="card flush"><table class="tbl audit"><thead><tr><th>Time</th>${inPilot ? "" : "<th>Pilot</th>"}<th>Who</th><th>Type</th><th>What</th></tr></thead><tbody>
  ${rows.slice().reverse().map(e => `<tr class="${e.actor.startsWith("Pia") ? "pia-row" : ""}"><td class="mono small">${e.at}</td>${inPilot ? "" : `<td class="small">${esc(pilot(e.pid) ? pilot(e.pid).firm : "")}</td>`}<td class="small">${e.actor.startsWith("Pia") ? chip(PIA + " Pia", "pia") : PERSON[e.actor] ? pl(e.actor) : esc(e.actor)}</td><td>${chip((icon[e.type] || "") + " " + e.type)}</td><td class="small">${esc(e.text)}</td></tr>`).join("") || `<tr><td colspan="5"><div class="empty-s">Nothing logged yet.</div></td></tr>`}
  </tbody></table></div>`;
}

function srcLink(cite, lbl = "Source") {
  if (!cite) return "";
  const l = lineAt(cite); const c = CALLS[cite.call]; if (!l) return "";
  const i = l.text.toLowerCase().indexOf(cite.quote.toLowerCase());
  const html = i < 0 ? esc(l.text) : esc(l.text.slice(0, i)) + "<mark>" + esc(l.text.slice(i, i + cite.quote.length)) + "</mark>" + esc(l.text.slice(i + cite.quote.length));
  return `<span class="src" tabindex="0" aria-label="Source">❝${lbl === "icon" ? "" : " " + lbl}<span class="hovercard"><span class="small muted">${c.source} · ${esc(c.title)} · ${c.date} · ${l.t}</span><span class="quote">“${html}”</span><span class="small">${pl(l.who)}</span><button class="btn small" onclick="A.call('${cite.call}',${cite.i})">View in call</button></span></span>`;
}

  <div class="card flush ${done ? "" : "pia-card"}"><table class="tbl ideas"><thead><tr><th>Idea</th><th>Practice</th><th>How they'd judge it</th><th>Decision</th><th>Use case name</th></tr></thead><tbody>
  ${r.ideas.map(u => `<tr class="${u.status}">
    <td>${S.editing === u.id && editable ? `<textarea rows="2" aria-label="Edit idea" onblur="A.saveEdit('${u.id}',this)">${esc(u.text)}</textarea>` : `<a class="ent uct" onclick="A.idea('${u.id}')">“${esc(u.text)}”</a>`} ${srcLink(u.cite, "icon")}
      <div class="small muted row wrap">${u.followUp ? chip(PIA + " Found in " + esc(u.followUp.from), "pia") : ""}${r.questions.some(q => q.ideaId === u.id) ? chip("? Question for the firm", "warn") : ""}${u.edited ? chip("Edited") : ""}${u.change === "new" ? chip("New", "pia") : u.change === "found" ? chip("Changed", "pia") : u.change === "kept" ? chip("Your edits kept") : ""}</div></td>
    <td class="small">${esc(u.practice)}</td>
    <td class="small">${u.successQuote ? `“${esc(u.successQuote.quote)}” ${srcLink(u.successQuote, "icon")}` : `<span class="muted">Not in the calls</span>`}</td>
    <td>${chip(st[u.status][0], st[u.status][1])}${u.status === "merged" ? `<div class="small muted">into ${esc((r.ideas.find(x => x.id === u.mergeInto) || {}).topic)}</div>` : ""}
      ${editable ? `<div class="row wrap small-gap"><button class="btn small ${u.status === "kept" ? "primary" : ""}" onclick="A.decide('${u.id}','kept')">Keep</button>
        <select aria-label="Merge with" onchange="A.merge('${u.id}',this)"><option value="">Merge with…</option>${r.ideas.filter(x => x.id !== u.id && x.status !== "dropped" && x.status !== "merged").map(x => `<option value="${x.id}" ${u.mergeInto === x.id ? "selected" : ""}>${esc(x.topic)}</option>`).join("")}</select>
        <button class="btn small" onclick="A.edit('${u.id}')">Edit</button><button class="btn small" onclick="A.decide('${u.id}','dropped')">Drop</button></div>` : ""}</td>
    <td>${u.status === "kept" ? (editable ? `<input class="ans" aria-label="Use case name" value="${esc(u.name)}" onchange="A.name('${u.id}',this)">` : `<b>${esc(u.name)}</b>`) : `<span class="small muted">–</span>`}</td></tr>`).join("")}
  </tbody></table></div>
  ${r.removed.length ? `<details class="card soft"><summary><b>${r.removed.length} removed by the source check</b> <span class="small muted">before anyone saw them</span></summary>${r.removed.map(x => `<p class="small"><s>${esc(x.text)}</s> · ${esc(x.why)}</p>`).join("")}</details>` : ""}
  ${r.skipped && r.skipped.length ? `<div class="banner warn small">Skipped ${r.skipped.length} call because the firm has not agreed to AI processing.</div>` : ""}`;
}
function gapsTab(p, r) {
  const fu = r.ideas.filter(u => u.followUp || r.questions.some(q => q.ideaId === u.id));
  if (!fu.length) return `<div class="empty card"><h3>No gaps</h3><p class="muted">Every idea was clear and came with how the firm would judge it.</p></div>`;
  return `<p class="small muted">Where an idea was vague or had no success measure, Pia looked in the other calls and the deal notes before asking.</p>

    <div class="lbl">History</div>${S.audit.filter(e => e.pid === pid && e.text.includes(u.topic)).map(e => `<p class="small">${e.at} · ${esc(e.actor)}: ${esc(e.text.slice(0, 100))}</p>`).join("") || `<p class="small muted">Not changed yet.</p>`}`;
  }
  return `<div class="scrim light" onclick="A.close()"></div><aside class="panel" role="dialog" aria-modal="true"><button class="icon close" aria-label="Close" onclick="A.close()">✕</button>${body}</aside>`;
}

function modal() {
  if (!S.modal) return "";
  const m = S.modal; let body = "";
  if (m.kind === "ideas") {
    const pid = S.r[1]; const p = pilot(pid); const r = run(pid); const n = st => r.ideas.filter(u => u.status === st).length;
    body = `<h2>Confirm the ideas</h2><p>${n("kept")} kept as use cases, ${n("merged")} merged, ${n("dropped")} dropped. ${r.questions.length} questions go into the plan for ${pl(p.ae)} to ask the firm.</p>
      <ul class="plain">${r.ideas.filter(u => u.status === "kept").map(u => `<li><b>${esc(u.name)}</b> <span class="small muted">${esc(u.practice)}</span></li>`).join("")}</ul>
      <div class="lbl">What this confirm writes</div><ul class="plain">${confirmWrites("ideas", p, r, { by: me() }).map(w => `<li>${chip(w.target)} ${esc(w.what)}</li>`).join("")}</ul>
      <p class="small muted">Task owners are confirmed separately by ${esc(ROLES.esm.name)}. Nothing goes to the firm.</p>
      <div class="row end"><button class="btn" onclick="A.closeModal()">Cancel</button><button class="btn primary" onclick="A.doConfirmIdeas()">Confirm ideas</button></div>`;
  }
  if (m.kind === "ideasDone") {
    const pid = S.r[1]; const c = conf(pid).ideas;
    body = `<h2>✓ Plan agreed</h2>${c.writes.map(w => `<p class="small">${chip("✓ Done", "green")} <b>${w.target}:</b> ${esc(w.what)}</p>`).join("")}
    <div class="slack"><div class="small muted">Slack · PilotHQ</div><p class="small">${esc(slackText(pid))}</p></div>
    <div class="row end"><button class="btn" onclick="S.modal=null;go('pilots/${pid}/activity')">See it in Activity</button><button class="btn primary" onclick="A.closeModal()">Done</button></div>`;
  }
  if (m.kind === "assign") {
    const p = pilot(m.pid); const c = capacity(m.pid)[m.w]; const flags = m.w === 0 ? openFlags(m.pid) : [];
    body = `<h2>Assign a Legal Engineer</h2><p>${esc(p.firm)}, week of ${WEEKS[m.w]}: short ${c.need - c.staffed} h for ${esc(c.driver.toLowerCase())}.</p>
    ${flags.length ? `<div class="banner warn small">${PIA} This also gives them the task Pia couldn't find an owner for: <b>${flags.map(f => esc(f.title)).join(", ")}</b> (${esc(flags[0].flag.replace(/^No one/, "no one"))}).</div>` : ""}
    <div class="card flush">${lesFree().map(x => `<div class="row-i">${pl(x.name, true)}<span class="small muted grow">${esc(x.specialities.join(", "))} · ${x.free} h free</span><button class="btn small primary" onclick="A.confirmAssign('${jq(x.name)}')">Assign</button></div>`).join("")}</div>
    <div class="row end"><button class="btn" onclick="A.closeModal()">Cancel</button></div>`;
  }
  if (m.kind === "digest") {
    const d = m.i >= 0 ? DIGESTS[m.i] : { week: "Week of 16 Nov", sent: "Draft, posts Monday 08:00", items: S.pilots.map(p => [p.firm, STAGES[stageOf(p.id)], nextStep(p), riskOf(p)[0]]) };
    body = `<h2>${m.i < 0 ? PIA + " " : ""}Weekly digest</h2><p class="small muted">${d.week} · #growth-pilots · ${d.sent}</p>
    <div class="slack ${m.i < 0 ? "pia-card" : ""}"><p><b>Pilots this week</b></p>${d.items.map(([f, st, ch, r]) => `<p class="small"><b>${esc(f)}</b> · ${esc(st)} · ${esc(ch)} · risk ${esc(r)}</p>`).join("")}</div>
    ${m.i < 0 ? `<p class="small muted">${PIA} Drafted by Pia from this week's activity.</p>` : ""}
    <div class="row end"><button class="btn primary" onclick="A.closeModal()">Close</button></div>`;
  }
  if (m.kind === "agenda") {
    body = `<h2>${PIA} Kickoff agenda</h2>${chip(PIA + " Drafted by Pia", "pia")}
    <ol class="small"><li>Introductions and the firm's goals (Priya Raman)</li><li>The use cases Tom agreed, and who sets each one up</li><li>Training plan: London and Singapore together, New York in its own session</li><li>Open questions for the firm</li><li>Readout date and the decision by 31 January</li></ol>
    <p class="small muted">Edit before you send. Pia doesn't send anything.</p><div class="row end"><button class="btn primary" onclick="A.closeModal()">Done</button></div>`;
  }
  return `<div class="scrim" onclick="if(event.target===this)A.closeModal()"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`;
}

function demoPanel() {
  const hv = pilot("hv");
  return `<div class="demo ${S.demoOpen ? "" : "closed"}"><button class="row between dhead" onclick="A.demo()"><b class="small">Simulate events</b><span class="small muted">${S.demoOpen ? "Hide" : "Show"}</span></button>
  ${S.demoOpen ? `<p class="small muted">Trigger what would normally come from Salesforce, Gong or the model. All firms and people are fictional.</p>
    <button class="btn small full" ${hv.stage !== "Proof of value" ? "disabled" : ""} onclick="A.stageChange()">Salesforce: move Harrow & Vale to pilot stage</button>
    <button class="btn small full" ${hv.stage === "Proof of value" || conf("hv").ideas || (S.anim && S.anim.pid === "hv") ? "disabled" : ""} onclick="A.stageAgain()">Salesforce: same stage change again</button>
    <button class="btn small full" ${S.g2Landed ? "disabled" : ""} onclick="A.landCall()">Gong: follow-up call lands</button>
    <label class="small row"><input type="checkbox" ${S.modelDown ? "checked" : ""} onchange="A.toggleModel()"> Model outage</label>
    <button class="btn small full ghost" onclick="A.reset()">Start again</button>` : ""}</div>`;
}
function toasts() { return `<div class="toasts" aria-live="polite">${S.toasts.map(t => `<div class="toast ${t.kind}">${t.kind === "pia" ? PIA + " " : ""}${esc(t.msg)}${t.undo ? ` <a class="undo" onclick="A.undo('${t.id}')">Undo</a>` : ""}</div>`).join("")}</div>`; }

// ---------- acceptance checks (run the real engine, and the real confirm actions, on fresh copies) ----------
const AC_DEFS = [
  "One run ends waiting for people, with piaVersion on it",
  "Every idea resolves to a sentence in a consented call",
  "The invented idea is removed by the source check",
  "Gap follow-up: one idea gets a quote found in another call; one becomes a question for the Account Executive; the trace shows both searches",
  "Owner proposal matches speciality and has 4+ free hours; one task has no owner and is flagged",
  "No time works for the training session; Pia proposes a split; every proposed slot passes the slot check",
  "A run stops cleanly at the 10-step cap (forced low cap)",
  "Calls without consent are skipped",
  "No recorded calls: nothing drafted",
  "Someone outside the deal team can't open the pilot",
  "Model down: run stops cleanly, nothing written",
  "Nothing is written before a person confirms; each confirm writes only its own piece",
  "Re-run after a new call keeps Tom's edits and marks what changed",
  "Repeat trigger is skipped with a reason",
  "Every read, decision, check and confirmation is in the activity log"
];
// Runs fn against a throwaway app state with a fresh Harrow & Vale run, then puts the real state back.
function sandbox(fn) {
  const saved = S; S = freshState(); S.role = "le";
  try {
    const p = pilot("hv"); p.stage = "Pilot: design";
    const r = runPia(p, { kind: "stage", now: 0 }); r.version = 1; S.runs.hv = [r];
    for (const st of r.steps) { const a = stepAudit("hv", st); log("hv", a.actor, a.type, a.text); }
    return fn(r, p);
  } finally { S = saved; }
}
function runAcceptanceChecks() {
  const hv = clone(PILOTS.find(p => p.id === "hv")), nh = clone(PILOTS.find(p => p.id === "nh")), bw = clone(PILOTS.find(p => p.id === "bw"));
  hv.stage = "Pilot: design";
  const r1 = runPia(hv);
  const checks = [
    () => [r1.status === "waiting" && r1.piaVersion === PIA_VERSION && r1.steps.at(-1).kind === "person", `${r1.piaVersion}, ${r1.steps.length} steps, ${r1.toolSteps} of ${r1.maxSteps} tool steps, ends "${r1.steps.at(-1).label}"`],
    () => [r1.ideas.length > 0 && r1.ideas.every(u => sourceCheck(u.cite, r1.read).ok && CALLS[u.cite.call].consent), `${r1.ideas.length} of ${r1.ideas.length} ideas resolve to a sentence in a consented call`],
    () => [r1.removed.some(x => x.id === "i-spa") && !r1.ideas.some(u => u.id === "i-spa"), `Removed: ${r1.removed.map(x => x.text + " (" + x.why + ")").join("; ")}`],
    () => { const lease = r1.ideas.find(u => u.id === "i-lease"); const q = r1.questions.find(x => x.ideaId === "i-emp"); const tr = r1.steps.filter(s => s.kind === "decision" && /Looked in/.test(s.detail));
      return [lease.followUp && lease.followUp.cite.call !== lease.cite.call && !!q && tr.some(s => /found in/.test(s.detail)) && tr.some(s => /not found, question added/.test(s.detail)), `Lease review: found in ${lease.followUp && lease.followUp.from}. Employment: question for ${hv.ae}. ${tr.length} searches in the trace`]; },
    () => { const own = r1.proposals.filter(p => p.owner); const fl = r1.proposals.filter(p => !p.owner);
      const okOwn = own.length > 0 && own.every(p => PERSON[p.owner].specialities.includes(p.practice) && p.freeAt >= MIN_FREE);
      return [okOwn && fl.length >= 1 && fl.every(f => /No one with .* has time this week/.test(f.flag)) && r1.steps.some(s => s.label === "Propose task owners" && s.detail.includes(ROLES.esm.name)), `${own.map(p => p.owner + " (" + p.reason + ")").join(", ")}; flagged: ${fl.map(f => f.flag).join(", ")}`]; },
    () => { const sc = r1.schedule; const none = proposeSlots(hv.calendar).length === 0;
      return [none && sc.fallback === "split" && sc.sessions.length === 2 && sc.sessions.every(s => s.slots.length && slotCheck(s).ok), `Finder found no time; split into ${sc.sessions.map(s => s.label + " (" + s.slots.length + " slots)").join(" and ")}; all pass the slot check`]; },
    () => { const r = runPia(hv, { maxSteps: 4 }); return [r.status === "stopped" && r.toolSteps === 4 && r.steps.at(-1).label === "Stopped at the step limit" && r.ideas.length > 0, `Cap 4: stopped after ${r.toolSteps} steps, kept ${r.ideas.length} ideas. Full run uses ${r1.toolSteps} of ${MAX_STEPS}`]; },
    () => { const r = runPia(bw); return [r.skipped.includes("gb1") && !r.ideas.some(u => u.cite.call === "gb1") && r.steps[1].status === "warn", r.steps[1].detail]; },
    () => { const r = runPia(nh); return [r.status === "nothing" && r.ideas.length === 0 && r.toolSteps === 0, r.steps.at(-1).detail]; },
    () => [!canView("out", hv) && canView("le", hv) && canView("esm", hv) && !canView("aie", hv), "Lars Berg (not on the deal) is refused; Tom Achebe can open it"],
    () => { const r = runPia(hv, { modelDown: true }); return [r.status === "failed" && r.ideas.length === 0 && r.proposals.length === 0 && /retry/i.test(r.steps.at(-1).detail), "Stopped before reading; no ideas, no proposals, nothing written, retry offered"]; },
    () => sandbox(r => {
      const before = S.writes.length; const readOnly = Object.values(TOOLS).every(t => t.readOnly);
      r.ideas.forEach(u => { u.status = "kept"; u.name = u.text; }); confirmIdeasCore("hv");
      const afterIdeas = S.writes.slice(before); const tasksAfterIdeas = S.extraTasks.length;
      confirmOwnersCore("hv"); const afterOwners = S.writes.slice(before + afterIdeas.length);
      const ok = readOnly && before === 0 && afterIdeas.length && afterIdeas.every(w => w.piece === "ideas") && tasksAfterIdeas === 0 && afterOwners.length && afterOwners.every(w => w.piece === "owners") && S.extraTasks.length > 0;
      return [ok, `0 writes before any confirm; Tom's confirm wrote ${afterIdeas.map(w => w.target).join(" and ")}; Dana's wrote ${S.extraTasks.length} tasks only. All ${Object.keys(TOOLS).length} tools read-only`];
    }),
    () => { const prev = clone(r1); const l = prev.ideas.find(u => u.id === "i-lease"); l.text = "Lease review: break clauses only"; l.edited = true; l.status = "kept"; l.name = "Break clause review";
      const r2 = mergeRun(prev, runPia(hv, { extraCalls: ["g2"] })); const l2 = r2.ideas.find(u => u.id === "i-lease");
      return [l2.text === l.text && l2.name === "Break clause review" && r2.changes.length > 0 && r2.ideas.some(u => u.change === "found"), `Tom's edit kept; changes: ${r2.changes.join("; ")}`]; },
    () => { const r = runPia(hv, { kind: "stage", now: 300, history: [{ kind: "stage", stage: hv.stage, at: 0, status: "waiting", version: 1 }] }); return [r.status === "skipped" && !!r.reason && r.toolSteps === 0, `Skipped: ${r.reason}`]; },
    () => sandbox(r => {
      r.ideas.forEach(u => { u.status = "kept"; u.name = u.text; }); confirmIdeasCore("hv"); confirmOwnersCore("hv");
      const types = new Set(S.audit.map(e => e.type)); const need = ["read", "decision", "check", "confirm"];
      return [need.every(t => types.has(t)) && S.audit.filter(e => e.type !== "confirm" && e.type !== "write" && e.actor !== "Slack").length === r.steps.length, `${S.audit.length} log entries: ${need.map(t => t + " " + S.audit.filter(e => e.type === t).length).join(", ")}`];
    })
  ];
  return checks.map(fn => { try { const [pass, evidence] = fn(); return { pass: !!pass, evidence }; } catch (e) { return { pass: false, evidence: "Error: " + e.message }; } });
}

S = freshState(); seed(); route();
