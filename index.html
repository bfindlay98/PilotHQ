<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PilotHQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --soft:#EFEDE7; --ink:#191917; --muted:#6B6A65; --line:#E3E1DA;
  --green:#1E6B47; --green-soft:#E2EFE7; --amber:#8A5300; --amber-soft:#FBF0DA; --red:#A3261C; --red-soft:#F8E2DF;
  --blue:#2B5788; --blue-soft:#E3EBF5; --r:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
h1{font-size:22px;margin:0 0 4px} h2{font-size:18px;margin:0 0 10px} h3{font-size:14px;margin:0 0 8px}
p{margin:6px 0}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:16px}
.logo{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--ink);color:#fff;font-weight:700}
.hdr-right{display:flex;gap:10px;align-items:center}
select,textarea,input{font:inherit;color:inherit}
select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#FCFCFA;resize:vertical}
main{max-width:1320px;margin:0 auto;padding:20px 20px 120px}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-family:ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;align-items:center} .between{justify-content:space-between} .end{justify-content:flex-end} .wrap{flex-wrap:wrap} .small-gap{gap:4px;margin-top:4px}
.link{color:var(--green);cursor:pointer;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:500;white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green)} .chip.warn{background:var(--amber-soft);color:var(--amber)} .chip.red{background:var(--red-soft);color:var(--red)} .chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.big{font-size:14px;padding:6px 12px}
.okc{color:var(--green)} .badc{color:var(--red)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#C9C6BD} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff} .btn.primary:hover{background:#185A3B}
.btn.big{padding:10px 18px;font-size:15px} .btn.small{padding:5px 9px;font-size:12.5px} .btn.full{width:100%;margin:4px 0;text-align:left} .btn.ghost{background:transparent}
.icon{border:1px solid var(--line);background:var(--surface);width:26px;height:26px;border-radius:6px;cursor:pointer}
.icon.ok:hover{background:var(--green-soft);color:var(--green)} .icon.no:hover{background:var(--red-soft);color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card.flush{padding:0;overflow:auto} .card.soft{background:var(--soft)} .card.empty{text-align:center;padding:40px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
.actions{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.crumbs{margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.pcard{cursor:pointer;display:flex;flex-direction:column;gap:8px;margin:0} .pcard:hover{border-color:#C9C6BD}
.next{padding:8px 10px;background:var(--bg);border-radius:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px} .tile b{font-size:22px}
table.grid{width:100%;border-collapse:collapse} .grid th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);background:#FBFAF7;position:sticky;top:0}
.grid td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.uc tr.rejected td{opacity:.5} .uc tr.accepted td:first-child{box-shadow:inset 3px 0 var(--green)}
.uct{font-weight:600}
.lib{max-width:260px}
.cap{display:flex;flex-direction:column;gap:4px;min-width:140px} .capbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden} .capbar span{display:block;height:100%;background:var(--green)} .capbar span.short{background:#C98A1B}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.count{display:inline-block;background:var(--soft);border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
.split{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.split aside{position:sticky;top:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px} .two .card{margin:0}
.banner{padding:10px 14px;border-radius:var(--r);margin-bottom:12px;border:1px solid}
.banner.info{background:var(--blue-soft);border-color:#C9D7EA} .banner.good{background:var(--green-soft);border-color:#C3DECD} .banner.bad{background:var(--red-soft);border-color:#EDC4BF} .banner.warn{background:var(--amber-soft);border-color:#EEDAB2}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.steps{list-style:none;padding:0;margin:0}
.st{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.st:first-child{border-top:0}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted)}
.st.ok .dot{background:var(--green-soft);color:var(--green)} .st.warn .dot{background:var(--amber-soft);color:var(--amber)} .st.blocked .dot,.st.error .dot{background:var(--red-soft);color:var(--red)} .st.stop .dot{background:var(--amber-soft);color:var(--amber)} .st.wait .dot{background:var(--blue-soft);color:var(--blue)}
.st.pending{opacity:.4}
.tool{display:inline-block;margin-top:3px;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite} .spin.big{width:26px;height:26px;color:var(--green)}
@keyframes sp{to{transform:rotate(360deg)}}
.src{position:relative;display:inline-block;color:var(--green);cursor:pointer;font-size:12.5px;font-weight:600;margin-left:2px}
.hovercard{display:none;position:absolute;z-index:30;left:0;top:100%;width:340px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);color:var(--ink);font-weight:400;flex-direction:column;gap:6px;cursor:default}
.src:hover .hovercard{display:flex}
.quote{font-size:13.5px} mark{background:#FFF0B3;padding:0 1px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);padding:16px;overflow:auto}
.people{margin:8px 0;padding:8px;background:var(--bg);border-radius:6px}
.tline{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px;border-radius:6px} .tline.hl{background:#FFF6CC;outline:1px solid #EBD67A}
.doc{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:8px 0;background:#FDFCF9;font-family:Georgia,serif}
.doctitle{font-family:Inter,sans-serif;font-weight:600;margin-bottom:6px} .docbody[contenteditable]:focus{outline:2px solid var(--green-soft)}
.doc.blur{filter:blur(4px);user-select:none}
.card.dd.blocked{border-color:#EDC4BF}
.invite{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);padding:12px;border-radius:6px;border:1px solid var(--line)}
.slots tr{cursor:pointer} .slots tr.sel td{background:var(--green-soft)}
ul.plain{list-style:none;padding:0;margin:0} ul.plain li{padding:5px 0}
.scrim{position:fixed;inset:0;background:rgba(25,25,23,.35);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px 22px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.slack{border-left:4px solid #6B4FA0;padding:8px 12px;background:var(--bg);border-radius:4px;margin:12px 0}
.demo{position:fixed;left:16px;bottom:16px;z-index:45;width:260px;background:var(--surface);border:1px dashed #B8B4A8;border-radius:var(--r);padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.demo.closed{width:160px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;max-width:380px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast.good{background:var(--green)} .toast.bad{background:var(--red)}
details summary{cursor:pointer}
.audit td{font-size:12.5px}
@media (max-width:900px){.split,.two{grid-template-columns:1fr}.split aside{position:static}.hdr-right label{display:none}main{padding:16px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
